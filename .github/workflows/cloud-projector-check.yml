name: GTNH 2.9.0 cloud projector check
on:
  workflow_dispatch:
  push:
    branches: [cloud-validation/0.3.8-alpha]
    paths: [.github/workflows/cloud-projector-check.yml]
permissions:
  contents: read
jobs:
  projector:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build fixture and run unit tests
        run: bash gradlew test prepareUpdateAsset -PmodernizationPackTests=true --no-daemon --no-configuration-cache
      - name: Download and verify the GTNH server
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o server.zip https://downloads.gtnewhorizons.com/ServerPacks/GT_New_Horizons_2.9.0_Server_Java_17-26.zip
          echo '0ab3de26e4d0de80a2df286916570d9af31c3394cb1f44aee8b9aa1f2ead9831  server.zip' | sha256sum --check
          unzip -q server.zip -d server
      - name: Run projector tests on a dedicated server
        run: |
          python3 tools/run_modernization_backend.py --pack "$RUNNER_TEMP/server" --java "$JAVA_HOME/bin/java" \
            --fixture build/release/gtnh-modernization-upgrade-0.3.8-alpha-GTNH-2.9.0.jar \
            --run-dir "$RUNNER_TEMP/projector-check" --suites projector
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projector-test-results
          path: |
            build/test-results/test/TEST-*.xml
            ${{ runner.temp }}/projector-check/summary.json
            ${{ runner.temp }}/projector-check/projector/projector-tests.json
            ${{ runner.temp }}/projector-check/projector/server-1.log

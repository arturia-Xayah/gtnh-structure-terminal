# GTNH现代化升级 / GTNH Modernization Upgrade
# Server or integrated server. Restart the game/server process after edits.
# 服务端或单人游戏配置；修改后重启游戏/服务端进程。
# 0 disables the corresponding cache. Values are integer bytes, not MiB.
# 0 关闭对应缓存；字节字段填写整数字节数，而非 MiB 数字。
storagecache {
    # Per channel: items and fluids have separate limits. 每通道分别计算。
    S:keyMaxEntries=4096
    S:keyMaxBytes=16777216
    S:prototypeMaxEntries=16384
    S:prototypeMaxBytes=67108864

    # Per export bus, both channels combined. 每个输出总线，物品流体合计。
    S:outputMaxEntries=256
    S:outputMaxBytes=8388608

    # Maximum accounted weight of one cached entry. 单条缓存准入上限。
    S:maxEntryBytes=1048576

    # Shared across all vault key/prototype/output caches. 全部聚合器相关缓存共用。
    S:globalMaxBytes=268435456
}
